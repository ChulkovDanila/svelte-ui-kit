name: Merge PR on Label

on:
  pull_request:
    types: [labeled]

jobs:
  merge-on-label:
    if: contains(github.event.label.name, 'merge') || contains(github.event.label.name, 'auto-merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            if (prData.state !== 'open') {
              console.log(`PR #${prNumber} is not open`);
              return;
            }
            
            if (prData.mergeable === false) {
              console.log(`PR #${prNumber} has conflicts`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '⚠️ Не могу объединить PR: есть конфликты. Пожалуйста, разрешите конфликты и попробуйте снова.'
              });
              return;
            }
            
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'merge'
              });
              
              console.log(`✅ Merged PR #${prNumber}`);
            } catch (error) {
              console.log(`❌ Error: ${error.message}`);
            }

